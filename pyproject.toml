[project]
name = "powermonitor"
version = "0.0.11"
description = "macOS battery and power monitor with real-time Textual TUI, SQLite history, and CSV/JSON export"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "narumi", email = "toucans-cutouts0f@icloud.com" }]
keywords = [
  "battery",
  "battery-health",
  "battery-monitor",
  "charging",
  "cli",
  "iokit",
  "ioreg",
  "macbook",
  "macbook-battery",
  "macos",
  "macos-battery",
  "power-monitor",
  "power-usage",
  "python",
  "sqlite",
  "textual",
  "tui",
  "usb-c",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]
dependencies = [
  "loguru>=0.7.3",
  "peewee>=3.18.3",
  "rich>=13.7.0",
  "textual>=0.50.0",
  "textual-plotext>=0.2.0",
  "typer>=0.21.0",
]

[project.urls]
Documentation = "https://narumiruna.github.io/power-monitor/"
Issues = "https://github.com/narumiruna/power-monitor/issues"
Repository = "https://github.com/narumiruna/power-monitor"

[project.scripts]
powermonitor = "powermonitor.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.10",
  "ty>=0.0.7",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.bumpversion]
current_version = "0.0.11"
tag = true
commit = true
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[tool.pytest.ini_options]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "--cov=powermonitor",
  "--cov-report=term-missing",
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
exclude = ["build"]
line-length = 120

[tool.ruff.lint]
select = [
  "B",  # flake8-bugbear
  "C",  # flake8-comprehensions
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8-naming
  "SIM",  # flake8-simplify
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
force-single-line = true
